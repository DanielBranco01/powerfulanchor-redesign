# Build no Netlify (o projeto powerfulanchor-redesign não tem definições de build no painel).
[build]
  command = "pnpm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

# Adaptador de Next.js (páginas por pedido, Server Actions, middleware). Num deploy por upload não é
# detetado sozinho: sem isto o Netlify publica a pasta .next em bruto e todas as páginas dão 404.
[[plugins]]
  package = "@netlify/plugin-nextjs"
